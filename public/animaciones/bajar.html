<!doctype html>
<html
  lang="es"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"resto","type":"number","label":"Lo que sobró","default":2},
    {"id":"cifra","type":"number","label":"Cifra que bajamos","default":5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bajar la cifra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Fredoka'; src: local('Fredoka'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff8ec;
        font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
        color: #2d2a32;
      }
      #root { position: relative; width: 100%; height: 100%; }
      #escena { position: absolute; inset: 0; }
      .titulo { position: absolute; top: 60px; left: 0; right: 0; text-align: center; font-size: 72px; font-weight: 700; }
      .etiqueta { position: absolute; font-size: 36px; color: #6b6577; text-align: center; width: 360px; }
      .tarjeta {
        position: absolute; width: 200px; height: 240px; border-radius: 32px;
        display: grid; place-items: center; font-size: 150px; font-weight: 700; background: #fff;
      }
      #resto { left: 620px; top: 220px; border: 8px solid #ff7a45; color: #e5612e; }
      #cifra { left: 1300px; top: 220px; border: 8px solid #4dabf7; color: #1c7ed6; }
      .panel {
        position: absolute; left: 0; right: 0; text-align: center; font-size: 64px; font-weight: 600; opacity: 0;
      }
      #mal { top: 540px; color: #e8590c; }
      #mal s { text-decoration-thickness: 8px; }
      #bien { top: 540px; color: #2f9e44; }
      #bloques { position: absolute; top: 640px; left: 0; right: 0; height: 320px; opacity: 0; }
      .barra {
        position: absolute; bottom: 60px; width: 46px; height: 230px; border-radius: 8px;
        background: repeating-linear-gradient(#ffd8a8 0 21px, #ff7a45 21px 23px);
        border: 3px solid #e5612e;
      }
      .cubo {
        position: absolute; bottom: 60px; width: 46px; height: 46px; border-radius: 8px;
        background: #a5d8ff; border: 3px solid #1c7ed6;
      }
      .leyenda { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; font-size: 44px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bajar" data-start="0" data-duration="13" data-width="1920" data-height="1080">
      <div id="escena">
        <h1 class="titulo" id="titulo">Bajamos la siguiente cifra</h1>
        <p class="etiqueta" style="left: 540px; top: 480px" id="et-resto">Lo que sobró</p>
        <p class="etiqueta" style="left: 1220px; top: 480px" id="et-cifra">Cifra que bajamos</p>
        <div class="tarjeta" id="resto"></div>
        <div class="tarjeta" id="cifra"></div>
        <p class="panel" id="mal"></p>
        <p class="panel" id="bien"></p>
        <div id="bloques"><p class="leyenda" id="leyenda"></p></div>
      </div>
    </div>

    <script>
      (function () {
        const url = new URLSearchParams(location.search);
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const entero = (v, def, min, max) => {
          const n = Math.floor(Number(v));
          return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
        };
        const R = entero(url.get('resto') ?? vars.resto, 2, 0, 9998);
        const C = entero(url.get('cifra') ?? vars.cifra, 5, 0, 9);
        const junto = R * 10 + C;

        document.getElementById('resto').textContent = String(R);
        document.getElementById('cifra').textContent = String(C);
        // Si el resto tiene varias cifras, la tarjeta se ensancha.
        const anchoResto = 200 + (String(R).length - 1) * 95;
        // Centramos el número que se forma (resto + cifra) en la pantalla.
        const izquierda = (1920 - (anchoResto + 10 + 200)) / 2;
        document.getElementById('resto').style.width = `${anchoResto}px`;
        document.getElementById('resto').style.left = `${izquierda}px`;
        document.getElementById('et-resto').style.left = `${izquierda + anchoResto / 2 - 180}px`;

        document.getElementById('mal').innerHTML = `¿${R} + ${C}? <s>${R + C}</s> ✗ ¡No se suma!`;
        document.getElementById('bien').innerHTML =
          R === 0
            ? `No sobró nada: el número es solo el ${C} ✓`
            : `Se pone al lado: <b>${junto}</b> ✓`;

        // Bloques: decenas (barras de 10) y unidades (cubitos), solo si sobró menos de 10.
        const bloques = document.getElementById('bloques');
        const conBloques = R > 0 && R <= 9;
        if (conBloques) {
          const total = R * 60 + 50 + C * 60;
          let x = (1920 - total) / 2;
          for (let i = 0; i < R; i++, x += 60) {
            const b = document.createElement('div');
            b.className = 'barra';
            b.style.left = `${x}px`;
            bloques.appendChild(b);
          }
          x += 50;
          for (let i = 0; i < C; i++, x += 60) {
            const c = document.createElement('div');
            c.className = 'cubo';
            c.style.left = `${x}px`;
            bloques.appendChild(c);
          }
          document.getElementById('leyenda').textContent =
            `${R} ${R === 1 ? 'decena' : 'decenas'} y ${C} ${C === 1 ? 'unidad' : 'unidades'} = ${junto}`;
        }

        // La cifra baja hasta ponerse a la derecha del resto.
        const destinoX = izquierda + anchoResto + 10 - 1300;

        const tl = gsap.timeline({ paused: true });
        tl.from('#titulo', { opacity: 0, y: -40, duration: 0.7 }, 0);
        tl.from('#resto, #et-resto', { opacity: 0, scale: 0.8, duration: 0.5 }, 0.5);
        tl.from('#cifra, #et-cifra', { opacity: 0, y: -200, duration: 0.6 }, 1.1);
        tl.to('#et-resto, #et-cifra', { opacity: 0, duration: 0.3 }, 2.6);
        tl.to('#cifra', { x: destinoX, duration: 1.1, ease: 'power2.inOut' }, 2.8);
        tl.to('#cifra', { borderColor: '#ff7a45', color: '#e5612e', duration: 0.4 }, 3.9);
        tl.to('#mal', { opacity: 1, duration: 0.4 }, 4.6);
        tl.to('#mal', { opacity: 0, duration: 0.4 }, 6.8);
        tl.to('#bien', { opacity: 1, duration: 0.4 }, 7.2);
        if (conBloques) {
          tl.to('#bloques', { opacity: 1, duration: 0.5 }, 8.6);
          tl.from('.barra', { y: 120, opacity: 0, duration: 0.4, stagger: 0.12 }, 8.6);
          tl.from('.cubo', { y: 120, opacity: 0, duration: 0.4, stagger: 0.1 }, 8.6 + R * 0.12);
        }

        window.__timelines = window.__timelines || {};
        window.__timelines['bajar'] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
