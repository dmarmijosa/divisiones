<!doctype html>
<html
  lang="es"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"dividendo","type":"number","label":"Caramelos","default":14},
    {"id":"divisor","type":"number","label":"Amigos","default":4}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Repartir caramelos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Fredoka'; src: local('Fredoka'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff8ec;
        font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
        color: #2d2a32;
      }
      #root { position: relative; width: 100%; height: 100%; }
      #escena { position: absolute; inset: 0; }
      .titulo {
        position: absolute; top: 60px; left: 0; right: 0;
        text-align: center; font-size: 76px; font-weight: 700;
      }
      .titulo b { color: #e5612e; }
      .monton {
        position: absolute; top: 190px; left: 360px; width: 1200px; height: 300px;
        border: 6px dashed #ece4d6; border-radius: 40px; background: #fff;
      }
      .monton-etiqueta {
        position: absolute; top: 205px; left: 390px; font-size: 34px; color: #6b6577;
      }
      .caramelo {
        position: absolute; width: 56px; height: 56px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffd8a8, #ff7a45 70%);
        box-shadow: 0 4px 0 #e5612e;
      }
      .plato {
        position: absolute; top: 640px; width: 230px; height: 330px;
        border-radius: 36px; background: #ffffff; border: 6px solid #d0bfff;
      }
      .plato-nombre {
        position: absolute; bottom: -70px; left: 0; right: 0;
        text-align: center; font-size: 36px; color: #6741d9; font-weight: 600;
      }
      .rotulo {
        position: absolute; left: 50%; top: 530px; transform: translateX(-50%); z-index: 2;
        padding: 6px 36px; border-radius: 999px; background: #fff3bf;
        text-align: center; font-size: 48px; font-weight: 600; opacity: 0; white-space: nowrap;
      }
      .final {
        position: absolute; left: 0; right: 0; top: 520px;
        text-align: center; font-size: 60px; font-weight: 700; opacity: 0;
      }
      .final .q { color: #2f9e44; }
      .final .r { color: #e8590c; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="repartir"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div id="escena">
        <h1 class="titulo" id="titulo"></h1>
        <div class="monton"></div>
        <div class="monton-etiqueta">Caramelos para repartir</div>
        <div id="platos"></div>
        <div id="caramelos"></div>
        <div id="rotulos"></div>
        <p class="final" id="final"></p>
      </div>
    </div>

    <script>
      (function () {
        // Números: de la URL (la app los pasa) o de las variables de HyperFrames.
        const url = new URLSearchParams(location.search);
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const entero = (v, def, min, max) => {
          const n = Math.floor(Number(v));
          return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
        };
        const N = entero(url.get('dividendo') ?? vars.dividendo, 14, 1, 40);
        const D = entero(url.get('divisor') ?? vars.divisor, 4, 1, 6);
        const Q = Math.floor(N / D);
        const R = N % D;

        document.getElementById('titulo').innerHTML =
          `Repartimos <b>${N}</b> caramelos entre <b>${D}</b> amigos`;

        // Platos
        const anchoPlato = 230, hueco = 40;
        const totalPlatos = D * anchoPlato + (D - 1) * hueco;
        const x0 = (1920 - totalPlatos) / 2;
        const platos = document.getElementById('platos');
        for (let i = 0; i < D; i++) {
          const p = document.createElement('div');
          p.className = 'plato';
          p.style.left = `${x0 + i * (anchoPlato + hueco)}px`;
          p.innerHTML = `<div class="plato-nombre">Amigo ${i + 1}</div>`;
          platos.appendChild(p);
        }

        // Caramelos en el montón (rejilla de 10 por fila)
        const caramelos = document.getElementById('caramelos');
        const porFila = 10, paso = 100;
        const origen = [];
        for (let k = 0; k < N; k++) {
          const c = document.createElement('div');
          c.className = 'caramelo';
          c.id = `c${k}`;
          const x = 400 + (k % porFila) * paso + 22;
          const y = 260 + Math.floor(k / porFila) * 62;
          c.style.left = `${x}px`;
          c.style.top = `${y}px`;
          caramelos.appendChild(c);
          origen.push({ x, y });
        }

        // Rótulos de cada vuelta
        const rotulos = document.getElementById('rotulos');
        for (let v = 0; v < Q; v++) {
          const r = document.createElement('p');
          r.className = 'rotulo';
          r.id = `vuelta${v}`;
          r.textContent = `Vuelta ${v + 1}: uno para cada amigo`;
          rotulos.appendChild(r);
        }
        document.getElementById('final').innerHTML =
          `A cada uno le tocan <span class="q">${Q}</span> (cociente)` +
          (R ? ` · Sobran <span class="r">${R}</span> (residuo)` : ' · ¡No sobra nada!');

        const tl = gsap.timeline({ paused: true });
        tl.from('#titulo', { opacity: 0, y: -40, duration: 0.7 }, 0);
        tl.from('.plato', { opacity: 0, y: 60, duration: 0.6, stagger: 0.1 }, 0.4);
        tl.from('.caramelo', { scale: 0, duration: 0.3, stagger: 0.02 }, 0.6);

        // Reparto: Q vueltas entre 2.2s y 10.6s
        const inicio = 2.2, total = 8.4;
        const duracionVuelta = Q > 0 ? total / Q : total;
        // Filas de dos caramelos por plato; si hay muchos, se aprietan para que quepan.
        const altoFila = Math.min(64, 270 / Math.max(1, Math.ceil(Q / 2)));
        for (let v = 0; v < Q; v++) {
          const t = inicio + v * duracionVuelta;
          tl.to(`#vuelta${v}`, { opacity: 1, duration: 0.2 }, t);
          tl.to(`#vuelta${v}`, { opacity: 0, duration: 0.2 }, t + duracionVuelta - 0.25);
          for (let i = 0; i < D; i++) {
            const k = v * D + i;
            const destinoX = x0 + i * (anchoPlato + hueco) + 87 + ((v % 2) * 40 - 20);
            const destinoY = 640 + 260 - Math.floor(v / 2) * altoFila - 4;
            tl.to(
              `#c${k}`,
              { x: destinoX - origen[k].x, y: destinoY - origen[k].y, duration: Math.min(0.6, duracionVuelta * 0.5) },
              t + (i * duracionVuelta * 0.6) / D,
            );
          }
        }

        // Lo que sobra se queda en el montón y parpadea
        for (let k = Q * D; k < N; k++) {
          tl.to(`#c${k}`, { scale: 1.35, duration: 0.35, yoyo: true, repeat: 3 }, 10.9);
        }
        tl.to('#final', { opacity: 1, y: -10, duration: 0.6 }, 11.2);

        window.__timelines = window.__timelines || {};
        window.__timelines['repartir'] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
